[package]
name = "ns-accounts"
version = "0.2.0"
description = "NS Accounts offline-first desktop accounting"
authors = ["NS Advisors"]
edition = "2021"

[lib]
name = "ns_accounts_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
